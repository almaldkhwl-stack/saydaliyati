<main class="form-page"><div class="container"><div class="form-card"><h2>إنشاء حساب</h2>
<form class="needs-validation" id="registerForm" novalidate>
<label class="form-label" for="fullName">الاسم الكامل</label><input id="fullName" name="name" type="text" class="form-control" required minlength="3"><div class="invalid-feedback">اكتب الاسم الكامل.</div>
<label class="form-label mt-3" for="registerEmail">البريد الإلكتروني</label><input id="registerEmail" name="email" type="email" class="form-control" required><div class="invalid-feedback">أدخل بريدًا صحيحًا.</div>
<label class="form-label mt-3" for="registerPhone">رقم الهاتف</label><input id="registerPhone" name="phone" type="tel" class="form-control" pattern="[0-9+\-\s]{7,20}" required><div class="invalid-feedback">أدخل رقم هاتف صحيح.</div>
<label class="form-label mt-3" for="registerPassword">كلمة المرور</label><input id="registerPassword" name="password" type="password" class="form-control" minlength="6" required><div class="invalid-feedback">6 أحرف على الأقل.</div>
<label class="form-label mt-3" for="confirmPassword">تأكيد كلمة المرور</label><input id="confirmPassword" name="confirm" type="password" class="form-control" minlength="6" required><div class="invalid-feedback">أعد كتابة كلمة المرور.</div>
<button class="btn btn-primary mt-4" type="submit">إنشاء الحساب</button>
</form></div></div></main><footer><p>جميع الحقوق محفوظة © 2026 صيدليتي</p></footer>
